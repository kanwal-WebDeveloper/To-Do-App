<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>To-Do List</h1>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="row">
            <span class="plus-icon">+</span>
            <input type="text" id="input-box" placeholder="Add your task..." onkeydown="if(event.key==='Enter') addTask()">
            <button class="add-btn" onclick="addTask()">Add Task</button>
        </div>

        <!-- EMPTY STATE -->
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="8" y="28" font-size="10" fill="#c6e0cc">+</text>
                    <text x="78" y="22" font-size="10" fill="#c6e0cc">+</text>
                    <text x="85" y="68" font-size="8" fill="#c6e0cc">+</text>
                    <text x="12" y="72" font-size="8" fill="#c6e0cc">+</text>
                    <rect x="22" y="20" width="46" height="58" rx="5" fill="#d4ead9"/>
                    <rect x="30" y="36" width="30" height="4" rx="2" fill="#a8cdb0"/>
                    <rect x="30" y="46" width="24" height="4" rx="2" fill="#a8cdb0"/>
                    <rect x="30" y="56" width="27" height="4" rx="2" fill="#a8cdb0"/>
                    <circle cx="38" cy="38" r="5" fill="#1a5c38" opacity="0.7"/>
                    <polyline points="35.5,38 37.2,39.8 40.5,36.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    <circle cx="38" cy="48" r="5" fill="#1a5c38" opacity="0.5"/>
                    <polyline points="35.5,48 37.2,49.8 40.5,46.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    <rect x="55" y="45" width="10" height="32" rx="2" transform="rotate(-40 55 45)" fill="#4ade80" opacity="0.85"/>
                    <polygon points="55,72 60,65 65,72" fill="#22c55e" opacity="0.85" transform="rotate(-40 60 68)"/>
                    <rect x="55" y="45" width="10" height="6" rx="2" transform="rotate(-40 55 45)" fill="#16a34a" opacity="0.9"/>
                </svg>
            </div>
            <h3>No tasks yet!</h3>
            <p>Add a task above to get started.</p>
        </div>

        <!-- TASK SECTION -->
        <div id="task-section" style="display:none;">
            <div class="tasks-header">
                <div class="tasks-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Your Tasks</span>
                    <span class="tasks-count" id="task-count">0</span>
                </div>
                <button class="clear-all" onclick="clearAll()">
                    Clear All
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                        <path d="M10 11v6M14 11v6"/>
                        <path d="M9 6V4h6v2"/>
                    </svg>
                </button>
            </div>
            <ul id="list-container"></ul>
        </div>
         <div class="footer">
            Designed & Developed by <span>Kanwal Imran</span>
        </div>
    </div>
    <script src="script.js"></script>    
</body>
</html>
